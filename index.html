<!DOCTYPE html>
<html lang="id" class="h-full w-full overflow-hidden select-none">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hospital Smart Door Sign - 10" Fixed Display</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Inter & Plus Jakarta Sans Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
          },
          colors: {
            hospital: {
              navy: '#1e3a5f',
              blue: '#315d86',
              lightBlue: '#edf4f9',
              bedBg: '#edf4f9',
              cardBorder: '#d9e2ec',
              alertRed: '#d32f2f',
              alertRedBg: '#fff5f5',
              alertRedBorder: '#fecaca',
              pillAmberBg: '#fef3c7',
              pillAmberText: '#92400e',
              pillRedBg: '#fee2e2',
              pillRedText: '#991b1b'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="h-full w-full overflow-hidden bg-slate-100 dark:bg-slate-950 text-slate-800 font-sans flex flex-col p-2 sm:p-3 md:p-3.5 antialiased selection:bg-transparent">

  <!-- SLIM HEADER BAR (Optimized for 10" screen height) -->
  <header class="flex-shrink-0 flex items-center justify-between bg-white dark:bg-slate-900 rounded-xl px-4 py-2 mb-2 border border-slate-200/90 dark:border-slate-800 shadow-xs">
    <!-- Room Info -->
    <div class="flex items-center gap-3">
      <div class="bg-blue-600 text-white px-3 py-1 rounded-lg font-extrabold text-sm sm:text-base tracking-wider shadow-xs flex items-center gap-1.5">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 21v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21m0 0h4.5V3.75a.75.75 0 00-.75-.75h-10.5a.75.75 0 00-.75.75V21h4.5z"/>
        </svg>
        <span id="roomNumber">ROOM 308</span>
      </div>
      <div>
        <span id="wardName" class="font-bold text-slate-800 dark:text-slate-100 text-xs sm:text-sm">BANGSAL DAHLIA (KELAS I)</span>
        <span class="text-[10px] text-emerald-600 dark:text-emerald-400 font-semibold ml-2">● 3 Bed Active</span>
      </div>
    </div>

    <!-- Center / Quick Actions (Discreet for Kiosk) -->
    <div class="flex items-center gap-1.5">
      <button onclick="togglePrivacyMode()" id="privacyModeBtn" class="px-2.5 py-1 text-[11px] font-semibold rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 border border-slate-200 dark:border-slate-700 transition" title="Toggle Mode Privasi">
        Privasi
      </button>
      <button onclick="toggleNightMode()" id="nightModeBtn" class="px-2.5 py-1 text-[11px] font-semibold rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 border border-slate-200 dark:border-slate-700 transition" title="Toggle Mode Malam">
        Mode Malam
      </button>
      <button onclick="openEditorModal()" class="px-2.5 py-1 text-[11px] font-bold rounded-lg bg-blue-50 dark:bg-blue-950 text-blue-600 dark:text-blue-300 border border-blue-200 dark:border-blue-800 hover:bg-blue-100 transition flex items-center gap-1">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10"/></svg>
        <span>Kelola</span>
      </button>
      <button onclick="toggleFullscreen()" class="p-1 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 border border-slate-200 dark:border-slate-700 transition" title="Layar Penuh (F11)">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75h-4.5m4.5 0v4.5m0-4.5L15 9m5.25 11.25h-4.5m4.5 0v-4.5m0 4.5L15 15"/></svg>
      </button>
    </div>

    <!-- Live Clock & Date -->
    <div class="flex items-center gap-3">
      <div class="hidden sm:block text-right">
        <div id="currentDate" class="text-[10px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wide">Senin, 19 Okt 2026</div>
        <div class="text-[9px] text-slate-400 dark:text-slate-500">St. Elisabeth Med. Ctr.</div>
      </div>
      <div id="currentTime" class="text-base sm:text-xl font-extrabold tracking-tight text-blue-900 dark:text-blue-300 font-mono bg-blue-50 dark:bg-blue-950/60 px-2.5 py-0.5 rounded-lg border border-blue-100 dark:border-blue-900">
        14:35:10
      </div>
    </div>
  </header>

  <!-- MAIN SIGNAGE BOARD: 100% FIXED 3-ROW GRID (Zero Scroll on 10" Display) -->
  <main class="flex-1 min-h-0 w-full bg-white dark:bg-slate-900 border-2 border-[#cbd5e1] dark:border-slate-800 rounded-2xl p-2 sm:p-2.5 shadow-md flex flex-col overflow-hidden">
    <!-- Exactly 3 Equal Rows via grid-rows-3 -->
    <div id="bedCardsContainer" class="flex-1 min-h-0 grid grid-rows-3 gap-2 sm:gap-2.5 overflow-hidden">
      <!-- Bed cards populated dynamically via app.js -->
    </div>
  </main>

  <!-- MODAL / DRAWER: EDIT DATA BED (Pop-up over the fixed screen) -->
  <div id="editorModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-3 hidden opacity-0 transition-opacity duration-200">
    <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-2xl w-full max-w-xl max-h-[92vh] flex flex-col overflow-hidden transform scale-95 transition-transform duration-200" id="modalCard">
      
      <!-- Modal Header -->
      <div class="px-5 py-3.5 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between flex-shrink-0">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-lg bg-blue-100 dark:bg-blue-950 text-blue-700 dark:text-blue-300 flex items-center justify-center font-bold">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
          </div>
          <div>
            <h2 class="text-sm font-bold text-slate-900 dark:text-white">Kelola Bed & Event Pasien</h2>
            <p class="text-[11px] text-slate-500 dark:text-slate-400">Pilih bed untuk memperbarui data klinis</p>
          </div>
        </div>
        <button onclick="closeEditorModal()" class="text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 p-1 rounded-lg">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <!-- Modal Body (Scrollable form inside modal only) -->
      <div class="p-4 overflow-y-auto space-y-4 flex-1 text-xs">
        
        <!-- Bed Selector Tabs -->
        <div>
          <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1.5">Pilih Bed</label>
          <div class="grid grid-cols-3 gap-2" id="bedSelectorTabs">
            <!-- Populated via JS -->
          </div>
        </div>

        <form id="bedEditForm" onsubmit="saveBedChanges(event)" class="space-y-3.5">
          <!-- Room Info -->
          <div class="grid grid-cols-2 gap-2.5">
            <div>
              <label class="block text-[11px] font-semibold text-slate-600 dark:text-slate-300 mb-0.5">Nomor Kamar</label>
              <input type="text" id="inputRoomNumber" class="w-full text-xs px-2.5 py-1.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white outline-none focus:ring-1 focus:ring-blue-500">
            </div>
            <div>
              <label class="block text-[11px] font-semibold text-slate-600 dark:text-slate-300 mb-0.5">Nama Bangsal</label>
              <input type="text" id="inputWardName" class="w-full text-xs px-2.5 py-1.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white outline-none focus:ring-1 focus:ring-blue-500">
            </div>
          </div>

          <!-- Care Team -->
          <div class="border-t border-slate-100 dark:border-slate-800 pt-3">
            <h3 class="text-[10px] font-bold text-blue-600 dark:text-blue-400 uppercase tracking-wider mb-2">Tim Medis (Care Team)</h3>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
              <div>
                <label class="block text-[10px] font-semibold text-slate-500 mb-0.5">Attending Physician (DPJP)</label>
                <input type="text" id="inputPhysician" required class="w-full text-xs px-2.5 py-1.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white outline-none">
              </div>
              <div>
                <label class="block text-[10px] font-semibold text-slate-500 mb-0.5">Resident Medical Officer</label>
                <input type="text" id="inputRmo" required class="w-full text-xs px-2.5 py-1.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white outline-none">
              </div>
              <div>
                <label class="block text-[10px] font-semibold text-slate-500 mb-0.5">Nurse (Perawat Jaga)</label>
                <input type="text" id="inputNurse" required class="w-full text-xs px-2.5 py-1.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white outline-none">
              </div>
            </div>
          </div>

          <!-- Next Care Event -->
          <div class="border-t border-slate-100 dark:border-slate-800 pt-3">
            <h3 class="text-[10px] font-bold text-red-600 dark:text-red-400 uppercase tracking-wider mb-2">Next Care Event</h3>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-[10px] font-semibold text-slate-500 mb-0.5">Nama Tindakan</label>
                <input type="text" id="inputEventName" required class="w-full text-xs px-2.5 py-1.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white outline-none">
              </div>
              <div>
                <label class="block text-[10px] font-semibold text-slate-500 mb-0.5">Jam Tindakan</label>
                <input type="text" id="inputEventTime" required class="w-full text-xs px-2.5 py-1.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white outline-none">
              </div>
            </div>
            <div class="grid grid-cols-2 gap-2 mt-2">
              <div>
                <label class="block text-[10px] font-semibold text-slate-500 mb-0.5">Status</label>
                <select id="inputEventStatus" class="w-full text-xs px-2.5 py-1.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white outline-none">
                  <option value="Overdue">Overdue (Terlambat)</option>
                  <option value="Scheduled">Scheduled (Tepat Waktu)</option>
                  <option value="In Progress">In Progress</option>
                  <option value="Done">Completed</option>
                </select>
              </div>
              <div>
                <label class="block text-[10px] font-semibold text-slate-500 mb-0.5">Catatan</label>
                <input type="text" id="inputEventNote" class="w-full text-xs px-2.5 py-1.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white outline-none">
              </div>
            </div>
          </div>

          <!-- Badges -->
          <div class="border-t border-slate-100 dark:border-slate-800 pt-3">
            <h3 class="text-[10px] font-bold text-amber-600 dark:text-amber-400 uppercase tracking-wider mb-2">Safety Indicators</h3>
            <div class="space-y-2">
              <div class="flex items-center gap-2 p-2 rounded-lg bg-amber-50 dark:bg-amber-950/30 border border-amber-200">
                <input type="checkbox" id="checkFallRisk" class="rounded text-amber-600">
                <label for="checkFallRisk" class="font-bold text-amber-900 dark:text-amber-200 text-xs">Fall Risk</label>
                <input type="text" id="inputFallRiskNote" class="flex-1 text-[11px] px-2 py-0.5 rounded border border-amber-300 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100">
              </div>
              <div class="flex items-center gap-2 p-2 rounded-lg bg-rose-50 dark:bg-rose-950/30 border border-rose-200">
                <input type="checkbox" id="checkNPO" class="rounded text-rose-600">
                <label for="checkNPO" class="font-bold text-rose-900 dark:text-rose-200 text-xs">NPO (Puasa)</label>
                <input type="text" id="inputNPONote" class="flex-1 text-[11px] px-2 py-0.5 rounded border border-rose-300 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100">
              </div>
              <div class="flex items-center gap-2 p-2 rounded-lg bg-rose-50 dark:bg-rose-950/30 border border-rose-200">
                <input type="checkbox" id="checkAllergy" class="rounded text-rose-600">
                <label for="checkAllergy" class="font-bold text-rose-900 dark:text-rose-200 text-xs">Allergy</label>
                <input type="text" id="inputAllergyNote" class="flex-1 text-[11px] px-2 py-0.5 rounded border border-rose-300 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100">
              </div>
            </div>
          </div>

          <!-- Buttons -->
          <div class="pt-3 flex items-center justify-end gap-2 border-t border-slate-100 dark:border-slate-800">
            <button type="button" onclick="closeEditorModal()" class="px-3 py-1.5 font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 rounded-lg">Batal</button>
            <button type="submit" class="px-4 py-1.5 font-bold text-white bg-blue-600 hover:bg-blue-700 rounded-lg shadow-sm">Simpan</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
